name: Build and Push MCP Server

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      # .mcp.json pins the image tag users actually run. On a release it must
      # name the image this very run publishes, or the plugin ships pointing at
      # something that does not exist (or worse, at an older build). That is the
      # invariant worth enforcing.
      #
      # It is deliberately NOT tied to plugin.json's version: that field gates
      # whether users are offered an update, which is independent of which image
      # to run. A pre-release pins .mcp.json to the beta image while leaving the
      # version untouched, so existing installs stay where they are.
      - name: Check .mcp.json pins the image this run publishes
        run: |
          mcp_tag=$(jq -r '.mcpServers.talos.args[-1]' .mcp.json | sed 's/.*talos-mcp://')
          plugin_version=$(jq -r '.version' .claude-plugin/plugin.json)
          echo ".mcp.json image tag : $mcp_tag"
          echo "plugin.json version : $plugin_version"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            want="${{ github.ref_name }}"; want="${want#v}"
            if [ "$mcp_tag" != "$want" ]; then
              echo "::error::releasing $want but .mcp.json pins talos-mcp:$mcp_tag — bump .mcp.json"
              exit 1
            fi
            echo "release pin OK: .mcp.json -> $want"
          else
            echo "::notice::branch build; .mcp.json pin is only enforced on tag pushes"
          fi

      - uses: actions/setup-go@v6
        with:
          go-version-file: talos-mcp/go.mod

      - name: Build, vet and test the MCP server
        run: |
          cd talos-mcp
          go build ./...
          go vet ./...
          go test ./...

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ionnistor/talos-mcp
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - uses: docker/build-push-action@v7
        with:
          context: ./talos-mcp
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
